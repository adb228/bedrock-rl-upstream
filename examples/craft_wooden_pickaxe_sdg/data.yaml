worlds: 1
samples_per_world: 1
seed: 20260915
max_world_attempts: 1
sampler:
  type: bedrock_rl.sdg:SeedCases
  seeds: [0]
  decision_seeds: [2026091501]
generator:
  type: bedrock_rl.sdg:ScriptedEpisodeGenerator
  task: task.yaml
  policy:
    type: bedrock_rl.sdg.policy.progression:SurvivalProgressionPolicy
