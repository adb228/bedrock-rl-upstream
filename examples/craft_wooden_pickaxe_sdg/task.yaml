name: craft_wooden_pickaxe_sdg
goal: Harvest three natural logs and craft a wooden pickaxe.
goal_cu: |
  Harvest three natural logs. Craft planks, sticks, and a crafting table,
  place the table, then use its 3x3 grid to craft a wooden pickaxe.
raster: cpu
view_distance: 8
seeds: [0]
view: netherite-procedural
init: {yaw: [-180, 180], pitch: [-8, 8]}
max_lines: 160
max_ticks: 12000
max_turns: 160
max_ticks_per_turn: 1000
settle_ticks: 2
decision_cost: 0.0
snapshot_radius: 32
initial_state:
  player: {health: 20, food: 20, saturation: 20}
  spawn:
    hazard_clearance: 1
    constraints:
      - {block: log, min_distance: 4, max_distance: 12}
  world:
    mode: survival
    difficulty: normal
    weather: clear
    time: 1000
    mobs: false
fail:
  type: any
  of:
    - {type: player_fluid_state, block: lava}
    - {type: vitals_changed, max_health: 19}
  reward: -1.0
success:
  type: item_gained
  item: wooden_pickaxe
  count: 1
  reward: 1.0
